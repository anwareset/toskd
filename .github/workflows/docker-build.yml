name: Docker Build & Push to GHCR

on:
  push:
    # Jalankan di setiap push ke branch mana pun + tag versi (vX.Y.Z)
    branches:
      - "**"
    tags:
      - "v*"
  # Bisa juga di-trigger manual dari tab Actions (debug/rebuild ulang)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Cegah push beruntun yang sama saling tumpuk — run terbaru membatalkan yang lama
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # Multi-arch (amd64 + arm64 via QEMU) butuh waktu lebih lama dari build single-arch
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Unit tests (pre-build gate, non-blocking) ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # continue-on-error: suite punya 3 kegagalan pre-existing di
      # tests/test-bulk-parser.mjs (88/91 pass, lihat AGENTS.md §5) —
      # kegagalan TIDAK memblokir build image multi-arch, tapi hasilnya
      # tetap terlihat jelas di ringkasan run.
      - name: Run tests
        continue-on-error: true
        run: pnpm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN sudah otomatis punya hak push ke GHCR (permissions: packages: write)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tag otomatis: nama branch, tag v*, SHA, dan `latest` khusus default branch
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Multi-arch: image tunggal dengan manifest untuk amd64 + arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache antar-build di GitHub Actions — rebuild berikutnya jauh lebih cepat
          cache-from: type=gha
          cache-to: type=gha,mode=max
