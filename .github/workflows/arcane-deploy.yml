name: Arcane Deploy

# Deploy hanya setelah Docker Release workflow sukses. Source release selalu
# canonical stable SemVer tag; workflow ini tidak pernah dipicu dari branch CI.
on:
  workflow_run:
    workflows: ["Docker Release & Push to GHCR"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release workflow did not originate from a canonical stable SemVer tag"
            exit 1
          fi

      - name: Trigger Arcane deployment webhook
        env:
          ARCANE_WEBHOOK_URL: ${{ secrets.ARCANE_WEBHOOK_URL }}
        run: |
          if [ -z "$ARCANE_WEBHOOK_URL" ]; then
            echo "::error::ARCANE_WEBHOOK_URL secret is not configured"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 60 \
            -X POST "$ARCANE_WEBHOOK_URL" \
            -H "Content-Type: application/json"

      - name: Verify deployment via /health
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          EXPECTED_VERSION: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SITE_DOMAIN" ]; then
            echo "::error::SITE_DOMAIN repo variable not set — tambahkan domain toskd tanpa skema"
            exit 1
          fi
          EXPECTED_SHORT_SHA="${EXPECTED_SHA:0:7}"
          echo "Expected version: ${EXPECTED_VERSION}"
          echo "Expected SHA: ${EXPECTED_SHORT_SHA}"
          echo "Health URL: https://${SITE_DOMAIN}/health"

          for i in $(seq 1 30); do
            RESP=$(curl --silent --show-error --max-time 15 "https://${SITE_DOMAIN}/health" 2>/dev/null) || true
            STATUS=$(printf '%s' "$RESP" | jq -r '.status // empty' 2>/dev/null || true)
            VERSION=$(printf '%s' "$RESP" | jq -r '.version // empty' 2>/dev/null || true)
            SHA=$(printf '%s' "$RESP" | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$STATUS" = "ready" ] && [ "$VERSION" = "$EXPECTED_VERSION" ] && [ "$SHA" = "$EXPECTED_SHORT_SHA" ]; then
              echo "Health check PASS (attempt ${i}/30): status=${STATUS}, version=${VERSION}, sha=${SHA}"
              exit 0
            fi
            echo "Attempt ${i}/30: status=${STATUS:-unreachable}, version=${VERSION:-n/a}, sha=${SHA:-n/a} (expected version=${EXPECTED_VERSION}, sha=${EXPECTED_SHORT_SHA})"
            [ "$i" -lt 30 ] && sleep 10
          done

          echo "::error::Health check FAILED after 30 attempts — release version/SHA tidak match atau service belum ready"
          exit 1
