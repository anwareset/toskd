<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/assets/toskd-emoticon.svg" type="image/svg+xml" />
    <title>TOSKD Login</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <div class="site-wrapper">
      <div class="login-container">
        <div class="login-logo" aria-hidden="true">🔐</div>
        <h1 class="app-title login-title">Login Admin</h1>
        <p class="login-subtitle">Kelola Bank Soal &amp; Paket Soal</p>
        <div id="login-error" class="login-error" role="alert"></div>
        <form id="login-form" class="cms-form">
          <div class="login-form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="input-field"
              required
              autocomplete="username"
              autofocus
            />
          </div>
          <div class="login-form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="input-field"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn-primary btn-block">Login</button>
        </form>
        <p class="login-back-link">
          <a href="/">Kembali ke halaman utama</a>
        </p>
      </div>
      <footer class="footer">
        Untuk latihan SKD · Made with ♥️ in 2026
      </footer>
    </div>
    <script src="/js/login.js"></script>
  </body>
</html>
