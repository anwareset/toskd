<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="icon" href="/assets/toskd-emoticon.svg" type="image/svg+xml">
        <title>TOSKD Paket Ujian</title>
        <link rel="stylesheet" href="/css/tokens.css" />
        <link rel="stylesheet" href="/css/styles.css" />
        <script src="/js/theme.js"></script>
    </head>
    <body>
        <div class="site-wrapper">
            <div class="container">
                <div class="header">
                    <h1 class="app-title">📝 Pilih Paket Soal</h1>
                    <button class="btn-back" onclick="location.href = '/'">
                        <span class="btn-back-icon" aria-hidden="true"></span>
                        <span class="btn-back-label">Kembali</span>
                    </button>
                </div>
                <div id="loading" class="loading-overlay">
                    <div class="spinner"></div>
                </div>
                <div class="search-bar" id="pack-search-bar">
                    <div class="search-bar-input-wrap">
                        <input
                            type="text"
                            id="pack-search"
                            class="input-field search-bar-input"
                            placeholder="🔍 Cari paket..."
                            aria-label="Cari paket ujian"
                            autocomplete="off"
                        />
                        <button
                            type="button"
                            id="pack-search-clear"
                            class="search-clear-btn"
                            hidden
                            aria-label="Reset pencarian"
                            title="Reset pencarian"
                        >
                            ×
                        </button>
                    </div>
                </div>
                <div id="loading-status" class="loading-status" hidden></div>
                <div id="pack-grid" class="card-grid"></div>

                <!-- Bottom pagination — reuses the shared .pagination-bar
                     component (same markup as scoreboard/paket-soal bottom
                     bars, see specs/paket-soal-pagination-spec.md §8.4).
                     6 kartu per halaman (CARDS_PER_PAGE di select-pack.js).
                     Bar disembunyikan via JS saat tidak ada paket. -->
                <div
                    class="pagination-bar pagination-bar--bottom pagination-bar--precise"
                    id="pack-pagination"
                    style="display: none"
                >
                    <div class="pagination-bar-left">
                        <span
                            id="pack-pagination-range"
                            class="pagination-text"
                            aria-live="polite"
                        ></span>
                    </div>
                    <div class="pagination-bar-right">
                        <button
                            class="btn-secondary pagination-btn"
                            id="pack-prev-btn"
                            type="button"
                            aria-label="Halaman sebelumnya"
                        >
                            Sebelumnya
                        </button>
                        <span
                            id="pack-page-info"
                            class="pagination-info"
                            aria-live="polite"
                            >Halaman 1 dari 1</span
                        >
                        <button
                            class="btn-secondary pagination-btn"
                            id="pack-next-btn"
                            type="button"
                            aria-label="Halaman selanjutnya"
                        >
                            Selanjutnya
                        </button>
                    </div>
                </div>
                <dialog id="name-modal" class="modal">
                    <div class="modal-content">
                        <h3>Masukkan Nama Peserta</h3>
                        <p style="color: var(--text-muted); margin-bottom: 12px">
                            Nama akan dicatat dalam hasil ujian
                        </p>
                        <input
                            type="text"
                            id="participant-name"
                            class="input-field"
                            placeholder="contoh: Prabowo Subianto"
                            aria-describedby="participant-name-helper"
                        />
                        <!-- Error inline validasi nama (2026-08-19): pattern
                             field-helper dari paket-soal/kelola-soal. Pesan
                             error merah di-set oleh select-pack.js;
                             kosong + tersembunyi saat nama valid. -->
                        <small
                            id="participant-name-helper"
                            class="field-helper field-helper--error"
                            style="display: none"
                            role="alert"
                        ></small>
                        <!-- Rincian paket + aturan ujian: diisi dinamis oleh
                             renderPackDetail() di select-pack.js saat
                             selectPack(id) dipanggil. Memberi tahu peserta
                             bahwa menekan "Mulai Ujian" benar-benar memulai
                             ujian (timer langsung berjalan). -->
                        <div id="pack-detail" class="exam-prep"></div>
                        <div class="modal-buttons">
                            <button class="btn-secondary" id="cancel-btn">
                                Batal
                            </button>
                            <button class="btn-primary" id="start-btn">
                                Mulai Ujian
                            </button>
                        </div>
                    </div>
                </dialog>
            </div>
            <footer class="footer">
                Untuk latihan SKD · Made with ♥️ in
                2026
            </footer>
        </div>
        <script src="/js/select-pack.js"></script>
    </body>
</html>
